<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="walletGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#1d4ed8" flood-opacity="0.35"/>
    </filter>
  </defs>
  
  <!-- Rounded Gradient App Icon Background -->
  <rect width="512" height="512" rx="128" fill="url(#walletGrad)"/>
  
  <!-- White Modern Wallet Icon Geometry -->
  <g transform="translate(96, 96)" stroke="#ffffff" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Top Back Card Flap -->
    <path d="M40 70 V40 C40 26 52 14 66 14 H254 C268 14 280 26 280 40 V70" />
    
    <!-- Main Wallet Body -->
    <rect x="0" y="70" width="320" height="210" rx="36" />
    
    <!-- Wallet Card Clasp -->
    <path d="M200 135 H288 C306 135 320 149 320 167 C320 185 306 199 288 199 H200 Z" fill="#ffffff" fill-opacity="0.2" />
    
    <!-- Latch Button -->
    <circle cx="280" cy="167" r="10" fill="#ffffff" stroke="none" />
  </g>
</svg>
